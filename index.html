<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c56">
<title>NIYuV Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#16242b;--mute:#5d6f78;--line:#d3dde0;--acc:#0f5c56;--accink:#fff;--out:#b0452f;--ok:#2e7d4f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#1a2327;--ink:#e6eef0;--mute:#93a6ad;--line:#2b383d;--acc:#4fb3a9;--accink:#08201d;--out:#e0856f;--ok:#6cc590}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
#back{min-width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px}
#crumb{flex:1;font-weight:600;overflow-wrap:anywhere}
#crumb small{display:block;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid button,.pad button,.pre button{min-height:60px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;overflow-wrap:anywhere}
.grid button:active,.pad button:active,.pre button:active{background:var(--acc);color:var(--accink)}
.big button{min-height:96px;font-size:24px}
#amt{font-size:42px;font-weight:700;text-align:right;padding:10px 4px;font-variant-numeric:tabular-nums}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pre button{min-height:52px;padding:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:62px;font-size:24px}
.date{display:flex;align-items:center;justify-content:space-between;margin:10px 0;color:var(--mute)}
.date button{width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
#save{width:100%;min-height:64px;margin-top:12px;border:0;border-radius:16px;background:var(--acc);color:var(--accink);font:inherit;font-size:20px;font-weight:700}
#save:disabled{opacity:.4}
h2{font-size:16px;color:var(--mute);margin:24px 0 8px;font-weight:600}
.rec{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.rec div{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.rec small{color:var(--mute);display:block}
.rec b{font-variant-numeric:tabular-nums}
.rec .in{color:var(--ok)}.rec .out{color:var(--out)}
.rec button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute)}
#msg{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.sumb{width:100%;min-height:60px;margin-top:12px;border-radius:14px;border:1px solid var(--acc);background:none;color:var(--acc);font:inherit;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tiles small{display:block;color:var(--mute)}.tiles b{font-size:16px;overflow-wrap:anywhere}
.tiles .in{color:var(--ok)}.tiles .out{color:var(--out)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.cat{display:flex;justify-content:space-between;gap:8px;padding:8px 0 0;color:var(--mute);font-size:15px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.3px}
#crumb small{margin-top:2px}
.big .tin{border-left:7px solid var(--ok)}.big .tout{border-left:7px solid var(--out)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
.dn{display:flex;gap:14px;align-items:center}.dn svg{width:120px;height:120px;flex:none}
.lg{flex:1;min-width:0;font-size:14px}.lg div{display:flex;gap:6px;align-items:center;padding:2px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1;overflow-wrap:anywhere}
.note{display:block;color:var(--mute);margin-top:10px;font-size:13px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode button,.row3 button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.mode .on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.hist{color:var(--mute);text-align:right;min-height:22px;overflow-wrap:anywhere;font-size:15px;margin-bottom:8px}
.row3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin-top:8px}.row3 button:disabled{opacity:.4}
#note{width:100%;min-height:48px;margin-top:10px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qa button{text-align:left;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;overflow-wrap:anywhere}
.qa small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.addnew{border-style:dashed!important;color:var(--acc)!important;font-weight:700}
</style>
</head>
<body>
<header><button id="back" aria-label="Back" hidden>&#8592;</button><div id="crumb">Add entry</div></header>
<main id="main"><div id="msg">Loading categories…</div></main>
<div id="toast">Saved</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vScboKHs-qLBgSEwsfF-Rxz5DV7YUiTXTPMVssBSR_jB0CEVDtn45bn467A4XTglQ/pub?output=csv';
const PRESETS=[50,100,200,500,1000,5000,10000];
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwyNx82Mip6fY6XdlKVQcdlkKqDnsRyCvSM4AmszB1rILOhnHrQZT_wAxYF0pnn3ZEF/exec';  // paste your Apps Script web app URL here
const CLIENT_ID='850392329831-30ugaib56rm7hqvv09ckil6tm4m190a1.apps.googleusercontent.com';    // Google OAuth client ID (for the summary)
const SHEET_ID='1q3zsaiILZR4xUJCPMTQK5cg112J1dKDbNxumHcnz59c';     // ID of your private entries sheet
const KEY='NIYuV';         // paste your secret word here (same as in the script)
const $=id=>document.getElementById(id);
let header=[],data=[],path=[],amount='',dayOff=0,entries=[],custom=[],sum=false,ops=[],mode=1,note='',quickList=[],mOff=0,rows=null,token=null,err='',open={};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
 else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}return rows}
function build(t){const rows=parseCSV(t);header=rows[0].map(s=>s.trim());data=[];let blank=0;
 for(const r of rows.slice(1)){if(r.every(s=>!s.trim())){if(++blank>=3)break;continue}blank=0;data.push(r)}}
const bad=s=>!s||/^insert here$/i.test(s);
function col(i){const o=[];for(const r of data){const s=(r[i]||'').trim();if(!bad(s)&&!o.includes(s))o.push(s)}return o}
function find(name,a,b){for(let i=a;i<=Math.min(b,header.length-1);i++)if(header[i]===name)return col(i);return[]}
// levels: In: type > category > sub ; Out: type > group > category > sub
function csvOpts(p){
 if(p.length==0)return col(0);
 if(p[0]=='In'){if(p.length==1)return col(1);if(p.length==2)return find(p[1],3,11);return[]}
 if(p.length==1)return col(2);if(p.length==2)return find(p[1],12,18);if(p.length==3)return find(p[2],19,99);return[]}
function opts(p){const o=csvOpts(p).slice();custom.forEach(c=>{if(c.p.length>p.length&&p.every((x,i)=>c.p[i]==x)){const v=c.p[p.length];if(!o.includes(v))o.push(v)}});return o}
function maxD(p){return p[0]=='In'?3:4}
function lbl(p){const d=p.length;if(!d)return'type';return p[0]=='In'?(d==1?'category':'sub-category'):(d==1?'group':d==2?'category':'sub-category')}
function addNew(go){const n0=prompt('New '+lbl(path)+' name'+(path.length?' under '+nice(path[path.length-1]):'')+':');if(!n0)return;
 const n=n0.trim().replace(/\s+/g,'_').replace(/[|"<>]/g,'').slice(0,40);if(!n)return;
 if(opts(path).some(x=>x.toLowerCase()==n.toLowerCase())){alert('That already exists here.');return}
 custom.push({p:path.concat(n),s:0});store('custom',JSON.stringify(custom));sync();if(go)path.push(n);render()}
function addBtn(){return'<button class="addnew" data-add="1">＋ New '+lbl(path)+'</button>'}
async function pullCustom(){const r=await fetch(SCRIPT_URL+'?k='+encodeURIComponent(KEY)+'&a=custom');const j=await r.json();if(!j.ok)return;let ch=false;
 j.items.forEach(p=>{const k=p.join('|'),f=custom.find(c=>c.p.join('|')==k);if(!f){custom.push({p,s:1});ch=true}else f.s=1});
 if(ch){store('custom',JSON.stringify(custom));if(!sum&&!path.length)render()}}
function push(v){path.push(v);let o;while((o=opts(path)).length==1)path.push(o[0]);render()}
function back(){if(sum){sum=false;render();return}if(!path.length)return;path.pop();while(path.length&&opts(path).length==1)path.pop();amount='';ops=[];note='';render()}

function dateStr(){const d=new Date();d.setDate(d.getDate()+dayOff);return d.toISOString().slice(0,10).length?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):''}
function nice(s){return s.replace(/_/g,' ')}
function render(){
 $('back').hidden=!path.length&&!sum;if(sum)return renderSum();
 $('crumb').innerHTML=path.length?nice(path.join(' › ')):brand();
 const o=opts(path),m=$('main');
 if(o.length){m.innerHTML='<div class="grid'+(path.length==0?' big':'')+'">'+o.map((x,i)=>'<button class="'+(path.length==0?(x=='In'?'tin':'tout'):'')+'" data-i="'+i+'">'+nice(x)+'</button>').join('')+addBtn()+'</div>'+(path.length==0?quick()+dash()+sumBtn()+recent():'');
  m.querySelectorAll('.grid button[data-i]').forEach(b=>b.onclick=()=>push(o[b.dataset.i]));m.querySelector('[data-add]').onclick=()=>addNew(false);bindRec();m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{path=quickList[b.dataset.q].slice();amount='';ops=[];note='';render()});if($('sumb'))$('sumb').onclick=()=>{sum=true;render()};return}
 const tot=ops.reduce((x,y)=>x+y,0),fin=tot+(amount?mode*+amount:0),last=lastFor(path),pl=last&&!PRESETS.includes(last)?[last].concat(PRESETS):PRESETS;
 const sg=v=>v<0?' − ':' + ',h=ops.map((o,i)=>(i?sg(o):(o<0?'−':''))+Math.abs(o)).join('')+(amount?(ops.length?sg(mode):(mode<0?'−':''))+amount:'');
 const cm=[...new Set(entries.map(e=>e.c).filter(Boolean))].slice(0,4);
 m.innerHTML='<div id="amt">₹ '+fin.toLocaleString('en-IN')+'</div><div class="hist">'+(h||'Tap amounts to add or subtract')+'</div>'+
  '<div class="mode"><button id="mA" class="'+(mode>0?'on':'')+'">＋ Add</button><button id="mS" class="'+(mode<0?'on':'')+'">− Subtract</button></div>'+
  '<div class="pre">'+pl.map(p=>'<button data-p="'+p+'">'+(p==last&&!PRESETS.includes(p)?'↺ ':'')+p+'</button>').join('')+'</div>'+
  '<div class="pad">'+[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>'+
  '<div class="row3"><button id="undo">Undo</button><button id="ap"'+(amount?'':' disabled')+'>'+(mode>0?'＋':'−')+' Apply'+(amount?' '+amount:'')+'</button><button id="clr">Clear</button></div>'+
  '<input id="note" placeholder="Comment (optional)" maxlength="80" value="'+esc(note)+'">'+(cm.length?'<div class="chips">'+cm.map((c,i)=>'<button data-c="'+i+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  '<div class="date"><button id="dm" aria-label="Previous day">−</button><span id="dl">'+(dayOff==0?'Today · ':'')+dateStr()+'</span><button id="dp" aria-label="Next day">+</button></div>'+
  '<button id="save"'+(fin>0?'':' disabled')+'>Save entry</button>'+(path.length<maxD(path)?'<button id="addsub" class="sumb">＋ New '+lbl(path)+' under '+esc(nice(path[path.length-1]))+'</button>':'');
 const flush=()=>{if(amount){ops.push(mode*+amount);amount=''}};
 $('mA').onclick=()=>{mode=1;render()};$('mS').onclick=()=>{mode=-1;render()};
 m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{flush();ops.push(mode*+b.dataset.p);render()});
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='C')amount='';else if(k=='⌫')amount=amount.slice(0,-1);else if(amount.length<9)amount=(amount+k).replace(/^0+/,'');render()});
 $('ap').onclick=()=>{flush();render()};$('undo').onclick=()=>{if(amount)amount='';else ops.pop();render()};$('clr').onclick=()=>{ops=[];amount='';render()};
 $('note').oninput=e=>{note=e.target.value};
 m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{note=cm[b.dataset.c];render()});
 $('dm').onclick=()=>{dayOff--;render()};$('dp').onclick=()=>{if(dayOff<0){dayOff++;render()}};
 if($('addsub'))$('addsub').onclick=()=>addNew(true);$('save').onclick=save}
function save(){if(amount){ops.push(mode*+amount);amount=''}const fin=ops.reduce((x,y)=>x+y,0);if(fin<=0)return;
 entries.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:dateStr(),p:path.slice(),a:fin,c:note.trim(),x:ops.length>1?ops.map((o,i)=>(i?(o<0?' − ':' + '):(o<0?'−':''))+Math.abs(o)).join(''):'',t:Date.now()});store('entries',JSON.stringify(entries));sync();
 path=[];amount='';ops=[];note='';dayOff=0;const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);render()}
let syncing=false;
async function sync(){if(!SCRIPT_URL||syncing)return;syncing=true;
 try{for(const e of entries.slice().reverse()){if(e.s)continue;
  const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:KEY,e:{id:e.id,d:e.d,p:e.p,a:e.a,c:e.c||'',x:e.x||''}})});
  const j=await r.json();if(!j.ok)break;e.s=1;store('entries',JSON.stringify(entries))}
  for(const c of custom){if(c.s)continue;const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:KEY,a:'cat',p:c.p})});const j=await r.json();if(!j.ok)break;c.s=1;store('custom',JSON.stringify(custom))}
  await pullCustom()}catch(x){}
 syncing=false;if(!path.length)render()}
function recent(){if(!entries.length)return'';return'<h2>Recent entries</h2>'+entries.slice(0,6).map((e,i)=>'<div class="rec"><div>'+nice(e.p.slice(1).join(' › '))+'<small>'+e.d+(e.c?' · '+esc(e.c):'')+(SCRIPT_URL&&!e.s?' · not synced yet':'')+'</small></div><b class="'+(e.p[0]=='In'?'in':'out')+'">'+(e.p[0]=='In'?'+':'−')+e.a.toLocaleString('en-IN')+'</b><button data-del="'+i+'" aria-label="Delete entry">✕</button></div>').join('')}
function bindRec(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){entries.splice(+b.dataset.del,1);store('entries',JSON.stringify(entries));render()}})}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lastFor(p){const k=p.join('|'),e=entries.find(x=>x.p.join('|')==k);return e?e.a:0}
function quick(){const src=rows&&token?rows:entries,mp={};
 src.forEach(e=>{if(e.p&&e.p.length>1){const k=e.p.join('|'),x=mp[k]=mp[k]||{n:0,p:e.p,l:''};x.n++;if(e.d>x.l)x.l=e.d}});
 quickList=Object.values(mp).sort((a,b)=>b.n-a.n||(b.l>a.l?1:-1)).slice(0,10).map(x=>x.p);
 if(!quickList.length)return'';
 return'<h2>Quick add · most used</h2><div class="qa">'+quickList.map((p,i)=>'<button data-q="'+i+'">'+esc(nice(p[p.length-1]))+'<small>'+esc(nice(p.slice(0,-1).join(' › ')))+'</small></button>').join('')+'</div>'}
function brand(){return'<span class="brand"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M7 24V13M13 24V9M19 24v-8M25 24V6" stroke="var(--accink)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>NIYuV finance</span><small>Tap In or Out to add an entry</small>'}
function ymd(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dash(){
 const src=rows&&token?rows:entries.map(e=>({d:e.d,t:e.p[0],g:e.p[1]||'',a:e.a}));
 const k=ymd(new Date()).slice(0,7),f=n=>'₹ '+n.toLocaleString('en-IN');let inn=0,out=0;const gr={},day={};
 for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);day[ymd(d)]=0}
 src.forEach(r=>{if(r.d.slice(0,7)==k){if(r.t=='In')inn+=r.a;else{out+=r.a;gr[r.g]=(gr[r.g]||0)+r.a}}if(r.t!='In'&&r.d in day)day[r.d]+=r.a});
 const note='<small class="note">'+(rows&&token?'Both phones, from your Google Sheet':'This phone only. Sign in under Monthly summary to include both phones.')+'</small>';
 if(!inn&&!out&&!Object.values(day).some(v=>v))return'<div class="card"><h3>This month</h3>Add your first entry and your charts will appear here.'+note+'</div>';
 const C=['#0f766e','#c2410c','#4f46e5','#ca8a04','#be185d','#64748b'],list=Object.entries(gr).sort((a,b)=>b[1]-a[1]).slice(0,6);
 let off=25,arcs='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="6"/>';
 list.forEach(([n,v],i)=>{const p=out?v/out*100:0;arcs+='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="'+C[i]+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});
 const ds=Object.keys(day),mx=Math.max(...Object.values(day),1);
 const bars=ds.map((d,i)=>{const h=Math.round(day[d]/mx*42);return'<rect x="'+(i*20+3)+'" y="'+(46-h)+'" width="14" height="'+Math.max(h,1)+'" rx="3" fill="var(--acc)"/><text x="'+(i*20+10)+'" y="58" text-anchor="middle" font-size="8" fill="var(--mute)">'+new Date(d+'T00:00').toLocaleString('en',{weekday:'narrow'})+'</text>'}).join('');
 return'<div class="tiles" style="margin-top:14px"><div><small>In</small><b class="in">'+f(inn)+'</b></div><div><small>Out</small><b class="out">'+f(out)+'</b></div><div><small>Left</small><b>'+f(inn-out)+'</b></div></div>'+
 '<div class="card"><h3>Where this month went</h3>'+(out?'<div class="dn"><svg viewBox="0 0 42 42">'+arcs+'</svg><div class="lg">'+list.map(([n,v],i)=>'<div><i style="background:'+C[i]+'"></i><span>'+nice(n)+'</span><b>'+f(v)+'</b></div>').join('')+'</div></div>':'No spending yet this month.')+'</div>'+
 '<div class="card"><h3>Spending, last 7 days</h3><svg viewBox="0 0 140 62" width="100%" role="img" aria-label="Spending in the last 7 days">'+bars+'</svg>'+note+'</div>'}
function sumBtn(){return CLIENT_ID&&SHEET_ID?'<button id="sumb" class="sumb">Monthly summary</button>':''}
function signIn(){try{google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',callback:r=>{if(r.access_token){token=r.access_token;err='';rows=null;renderSum()}}}).requestAccessToken()}catch(e){err='Google sign-in is not ready yet. Wait a moment and try again.';renderSum()}}
async function loadRows(){$('main').innerHTML='<div id="msg">Loading your entries…</div>';
 try{const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/Entries!A2:G?valueRenderOption=UNFORMATTED_VALUE',{headers:{Authorization:'Bearer '+token}});
  if(r.status==401){token=null}
  else if(r.status==403||r.status==404){err='This Google account cannot open the entries sheet. Share the sheet with it and try again.'}
  else if(!r.ok){err='Could not load entries (error '+r.status+').'}
  else{const j=await r.json();rows=(j.values||[]).map(v=>({d:typeof v[1]=='number'?new Date(Date.UTC(1899,11,30)+v[1]*864e5).toISOString().slice(0,10):String(v[1]||''),t:v[2],g:String(v[3]||''),c:String(v[4]||''),a:+v[6]||0,p:[v[2],v[3],v[4],v[5]].filter(x=>x!==undefined&&x!=='').map(String)}))}
 }catch(e){err='Could not reach Google. Check the internet connection.'}
 renderSum()}
function renderSum(){const m=$('main');$('crumb').innerHTML='Monthly summary';
 if(!token){m.innerHTML='<div id="msg">'+(err||'Sign in with the Google account that can open your entries sheet.')+'</div><button id="save" style="margin-top:12px">Sign in with Google</button>';$('save').onclick=signIn;return}
 if(err){m.innerHTML='<div id="msg">'+err+'</div><button id="save" style="margin-top:12px">Try again</button>';$('save').onclick=()=>{err='';rows=null;renderSum()};return}
 if(!rows){loadRows();return}
 const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+mOff);const k=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,7);
 let inn=0,out=0;const gr={};
 rows.filter(r=>r.d.slice(0,7)==k).forEach(r=>{if(r.t=='In')inn+=r.a;else{out+=r.a;const g=gr[r.g]=gr[r.g]||{t:0,c:{}};g.t+=r.a;g.c[r.c]=(g.c[r.c]||0)+r.a}});
 const f=n=>'₹ '+n.toLocaleString('en-IN'),list=Object.entries(gr).sort((a,b)=>b[1].t-a[1].t);
 m.innerHTML='<div class="date"><button id="mm" aria-label="Previous month">‹</button><span>'+d.toLocaleString('en-IN',{month:'long',year:'numeric'})+'</span><button id="mp" aria-label="Next month">›</button></div>'+
 '<div class="tiles"><div><small>In</small><b class="in">'+f(inn)+'</b></div><div><small>Out</small><b class="out">'+f(out)+'</b></div><div><small>Left</small><b>'+f(inn-out)+'</b></div></div>'+
 (list.length?list.map(([n,g],i)=>'<div class="grp" data-i="'+i+'"><div class="gh"><span>'+nice(n)+'</span><b>'+f(g.t)+'</b></div><div class="bar"><i style="width:'+(out?Math.round(g.t/out*100):0)+'%"></i></div>'+(open[n]?Object.entries(g.c).sort((a,b)=>b[1]-a[1]).map(([c,v])=>'<div class="cat"><span>'+nice(c)+'</span><span>'+f(v)+'</span></div>').join(''):'')+'</div>').join(''):'<div id="msg">No entries this month.</div>')+
 '<button id="rf" class="sumb">Refresh</button>';
 $('mm').onclick=()=>{mOff--;renderSum()};$('mp').onclick=()=>{if(mOff<0){mOff++;renderSum()}};
 m.querySelectorAll('.grp').forEach(el=>el.onclick=()=>{const n=list[el.dataset.i][0];open[n]=!open[n];renderSum()});
 $('rf').onclick=()=>{rows=null;renderSum()}}
(async()=>{
 $('back').onclick=back;
 try{entries=JSON.parse(store('entries')||'[]')}catch(e){entries=[]}
 try{custom=JSON.parse(store('custom')||'[]')}catch(e){custom=[]}
 let t=null;
 try{const r=await fetch(CSV_URL);if(!r.ok)throw 0;t=await r.text();store('csv',t)}catch(e){t=store('csv')}
 if(!t){$('msg').textContent='Could not load categories from your sheet. Check the internet connection and reload.';return}
 build(t);render();sync();
 try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
